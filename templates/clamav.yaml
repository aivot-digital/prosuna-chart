{{- if not .Values.Clamav.Host }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clamav
  template:
    metadata:
      labels:
        app: clamav
    spec:
      {{- with .Values.ImagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clamav
          image: {{ .Values.Images.Clamav | quote }}
          ports:
            - name: clamd
              containerPort: 3310
          # About 1Gi with signatures loaded; a signature reload briefly needs twice that.
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              memory: 3Gi
          startupProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
      protocol: TCP
{{- end }}
