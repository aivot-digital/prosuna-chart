{{- if not .Values.Gotenberg.Host }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      {{- with .Values.ImagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gotenberg
          image: {{ .Values.Images.Gotenberg | quote }}
          ports:
            - name: http
              containerPort: 3000
          # Chromium and LibreOffice start on demand; conversions cause short memory spikes.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          # PDF templates and form input are user-controlled HTML, so Chromium may only load the
          # public Prosuna URL (fonts and CSS via <base href>) and Gotenberg's temp files. This blocks
          # cluster-internal and cloud metadata addresses; data: URLs (logos, QR codes) still work.
          # Gotenberg also checks each HTTPS connection as https://<host>:443, hence the optional port.
          env:
            - name: CHROMIUM_DENY_PRIVATE_IPS
              value: "true"
            - name: CHROMIUM_DENY_PUBLIC_IPS
              value: "true"
            - name: CHROMIUM_ALLOW_LIST
              value: {{ printf "^(https://%s(:443)?(/|$)|file:///tmp/)" (regexQuoteMeta .Values.Hostname) | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: gotenberg
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
{{- end }}
