{{- define "prosuna.api.config" -}}
{{- $db := .Values.Postgres.Prosuna }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prosuna-api
  namespace: {{ .Release.Namespace }}
data:
  PROSUNA_HOSTNAME: "https://{{ .Values.Hostname }}"
  PROSUNA_SERVER_PORT: "8080"
  PROSUNA_TIMEZONE: "Europe/Berlin"

  PROSUNA_ENVIRONMENT: {{ .Values.Hostname | quote }}
  PROSUNA_SENTRY_SERVER: {{ .Values.Prosuna.SentryDsnServer | quote }}
  PROSUNA_SENTRY_WEB_APP: {{ .Values.Prosuna.SentryDsnWebApp | quote }}

  PROSUNA_LOG_FORMAT: "ecs"
  PROSUNA_SEEDING_LOCAL_STORAGE_PROVIDERS_ENABLED: "true"

  # Services deployed by the chart use short names, which resolve in the pod's own namespace, so
  # a copy restored into another namespace never connects to the original services.
  PROSUNA_DB_HOST: {{ $db.Host | default "postgres-prosuna-rw" | quote }}
  PROSUNA_DB_PORT: {{ ternary 5432 $db.Port (empty $db.Host) | quote }}
  PROSUNA_DB_DATABASE: {{ $db.Database | quote }}

  PROSUNA_REDIS_HOST: {{ .Values.Redis.Host | default "redis" | quote }}
  PROSUNA_REDIS_PORT: {{ ternary 6379 .Values.Redis.Port (empty .Values.Redis.Host) | quote }}
  PROSUNA_REDIS_DATABASE: {{ .Values.Redis.Database | quote }}
{{- if and .Values.Redis.Host .Values.Redis.Tls }}
  SPRING_DATA_REDIS_SSL_ENABLED: "true"
{{- end }}

  PROSUNA_RABBITMQ_HOST: {{ .Values.Rabbitmq.Host | default "rabbitmq" | quote }}
  PROSUNA_RABBITMQ_PORT: {{ ternary 5672 .Values.Rabbitmq.Port (empty .Values.Rabbitmq.Host) | quote }}
{{- if and .Values.Rabbitmq.Host .Values.Rabbitmq.Tls }}
  SPRING_RABBITMQ_SSL_ENABLED: "true"
{{- end }}

  PROSUNA_CLAM_HOST: {{ .Values.Clamav.Host | default "clamav" | quote }}
  PROSUNA_CLAM_PORT: {{ ternary 3310 .Values.Clamav.Port (empty .Values.Clamav.Host) | quote }}

  PROSUNA_GOTENBERG_HOST: {{ .Values.Gotenberg.Host | default "gotenberg" | quote }}
  PROSUNA_GOTENBERG_PORT: {{ ternary 3000 .Values.Gotenberg.Port (empty .Values.Gotenberg.Host) | quote }}

  PROSUNA_SMTP_HOST: {{ .Values.Smtp.Host | quote }}
  PROSUNA_SMTP_PORT: {{ .Values.Smtp.Port | quote }}
  PROSUNA_SMTP_AUTH: "true"
  PROSUNA_SMTP_TLS: "true"
  PROSUNA_SMTP_USERNAME: {{ .Values.Smtp.Username | quote }}
  PROSUNA_FROM_MAIL: {{ .Values.Smtp.From | quote }}

  PROSUNA_KEYCLOAK_OIDC_HOSTNAME: "https://{{ .Values.Hostname }}/idp"
  PROSUNA_KEYCLOAK_OIDC_INTERNAL_HOSTNAME: "http://keycloak:8080/idp"
  PROSUNA_KEYCLOAK_OIDC_REALM: "staff"
  PROSUNA_KEYCLOAK_OIDC_FRONTEND_CLIENT_ID: "app"
  PROSUNA_KEYCLOAK_OIDC_BACKEND_CLIENT_ID: "backend"

  PROSUNA_SUPPORT_URL: {{ .Values.Prosuna.SupportUrl | quote }}
  PROSUNA_REPORT_MAIL: {{ .Values.Prosuna.ReportMail | quote }}
  PROSUNA_BOOTSTRAP_ADMIN_MAIL: {{ .Values.Prosuna.BootstrapAdminMail | quote }}
{{- end }}
{{- $secret := .Values.Secrets.ExistingSecret | default "prosuna" }}
{{- /* Credentials of the chart's services come from the Secrets their operators create. */}}
{{- $dbSecret := "postgres-prosuna-app" }}
{{- if .Values.Postgres.Prosuna.Host }}
{{- $dbSecret = required "Postgres.Prosuna.Secret is required when Postgres.Prosuna.Host is set" .Values.Postgres.Prosuna.Secret }}
{{- end }}
{{- $rabbitmqSecret := "rabbitmq-default-user" }}
{{- if .Values.Rabbitmq.Host }}
{{- $rabbitmqSecret = required "Rabbitmq.Secret is required when Rabbitmq.Host is set" .Values.Rabbitmq.Secret }}
{{- end }}
{{ include "prosuna.api.config" . }}
---
# Uploaded assets and attachments (./data/assets and ./data/attachments in /app).
# Helm keeps this claim on uninstall so uploaded files are never deleted with the release.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prosuna-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    # k3s local-path: create a "local" volume instead of hostPath, which Velero's file-system
    # backup cannot read. Other provisioners ignore this annotation.
    volumeType: local
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.Prosuna.Storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prosuna-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  # The data volume attaches to one node at a time, so stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prosuna-api
  template:
    metadata:
      # Refresh environment variables when Helm updates the loaded configuration.
      annotations:
        checksum/config: {{ include "prosuna.api.config" . | sha256sum | quote }}
        checksum/secrets: {{ toJson .Values.Secrets | sha256sum | quote }}
        # Velero copies the uploaded files when it backs up the namespace.
        backup.velero.io/backup-volumes: data
      labels:
        app: prosuna-api
        {{- if eq .Values.Ingress.Type "kyma" }}
        # APIRules route only to pods in the Istio service mesh.
        sidecar.istio.io/inject: "true"
        {{- end }}
    spec:
      # Prevent Kubernetes' GOTENBERG_PORT=tcp://... service variable from
      # overriding Spring's gotenberg.port and producing an invalid URL.
      enableServiceLinks: false
      {{- with .Values.ImagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prosuna-api
          image: {{ .Values.Images.Prosuna | quote }}
          args: [ "serve" ]
          ports:
            - name: prosuna-api
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/actuator/health
              port: prosuna-api
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: prosuna-api
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: prosuna-api
            periodSeconds: 10
            timeoutSeconds: 5
          env:
            # Size the heap from the memory limit; the JVM default of 25% is too small.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70"
            - name: PROSUNA_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: username
            - name: PROSUNA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: password
            - name: PROSUNA_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $rabbitmqSecret }}
                  key: username
            - name: PROSUNA_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $rabbitmqSecret }}
                  key: password
            {{- if and .Values.Redis.Host .Values.Redis.Secret }}
            # Spring Boot binds these to spring.data.redis.username and .password.
            - name: SPRING_DATA_REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.Redis.Secret }}
                  key: username
                  optional: true
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.Redis.Secret }}
                  key: password
            {{- end }}
            - name: PROSUNA_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: SecretsKey
            - name: PROSUNA_CAPTCHA_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: CaptchaKey
            - name: PROSUNA_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: SmtpPassword
            - name: PROSUNA_KEYCLOAK_OIDC_BACKEND_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: KeycloakBackendClientSecret
            {{- with .Values.Prosuna.ExtraEnv }}
            # Explicit env entries take precedence over the ConfigMap below.
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: prosuna-api
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prosuna-data
---
apiVersion: v1
kind: Service
metadata:
  name: prosuna-api
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: prosuna-api
  ports:
    - name: prosuna-api
      port: 8080
      targetPort: prosuna-api
      protocol: TCP
