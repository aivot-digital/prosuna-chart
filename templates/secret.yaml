{{- /* Keys read neither from Secrets.ExistingSecret nor from Secrets.Refs, stored in "prosuna". */}}
{{- $own := list }}
{{- if not .Values.Secrets.ExistingSecret }}
{{- range include "prosuna.secretKeys" . | fromJsonArray }}
{{- if not (hasKey $.Values.Secrets.Refs .) }}
{{- $own = append $own . }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Keycloak's password policy, checked here so the setup Job does not fail late. Unlike schema
pattern errors, these messages never print the password. Keycloak still checks its blacklist. */}}
{{- if has "KeycloakAdminPassword" $own }}
{{- $password := .Values.Secrets.KeycloakAdminPassword }}
{{- if not (and (regexMatch "[A-Z]" $password) (regexMatch "[a-z]" $password) (regexMatch "[0-9]" $password) (regexMatch "[^A-Za-z0-9]" $password)) }}
{{- fail "Secrets.KeycloakAdminPassword needs an uppercase letter, a lowercase letter, a digit and a special character" }}
{{- end }}
{{- if or (contains (lower .Values.Keycloak.AdminUsername) (lower $password)) (eq (lower $password) (lower .Values.Keycloak.AdminEmail)) }}
{{- fail "Secrets.KeycloakAdminPassword must not contain Keycloak.AdminUsername or equal Keycloak.AdminEmail" }}
{{- end }}
{{- end }}
{{- if $own }}
# Read by prosuna-api, and by keycloak and the setup Job unless Keycloak.Url is set.
# Secrets.ExistingSecret replaces it; keys in Secrets.Refs are left out.
apiVersion: v1
kind: Secret
metadata:
  name: prosuna
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- range $own }}
  {{ . }}: {{ get $.Values.Secrets . | b64enc | quote }}
  {{- end }}
{{- end }}
