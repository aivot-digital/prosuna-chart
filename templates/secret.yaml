{{- if not .Values.Secrets.ExistingSecret }}
{{- /* Keycloak's password policy, checked here so the setup Job does not fail late. Unlike schema
pattern errors, these messages never print the password. Keycloak still checks its blacklist. */}}
{{- $password := .Values.Secrets.KeycloakAdminPassword }}
{{- if not (and (regexMatch "[A-Z]" $password) (regexMatch "[a-z]" $password) (regexMatch "[0-9]" $password) (regexMatch "[^A-Za-z0-9]" $password)) }}
{{- fail "Secrets.KeycloakAdminPassword needs an uppercase letter, a lowercase letter, a digit and a special character" }}
{{- end }}
{{- if or (contains (lower .Values.Keycloak.AdminUsername) (lower $password)) (eq (lower $password) (lower .Values.Keycloak.AdminEmail)) }}
{{- fail "Secrets.KeycloakAdminPassword must not contain Keycloak.AdminUsername or equal Keycloak.AdminEmail" }}
{{- end }}
# Read by prosuna-api, keycloak and the setup Job. Secrets.ExistingSecret replaces it.
apiVersion: v1
kind: Secret
metadata:
  name: prosuna
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  SecretsKey: {{ .Values.Secrets.SecretsKey | b64enc | quote }}
  CaptchaKey: {{ .Values.Secrets.CaptchaKey | b64enc | quote }}
  SmtpPassword: {{ .Values.Secrets.SmtpPassword | b64enc | quote }}
  KeycloakBootstrapAdminPassword: {{ .Values.Secrets.KeycloakBootstrapAdminPassword | b64enc | quote }}
  KeycloakAdminPassword: {{ .Values.Secrets.KeycloakAdminPassword | b64enc | quote }}
  KeycloakDeploymentClientSecret: {{ .Values.Secrets.KeycloakDeploymentClientSecret | b64enc | quote }}
  KeycloakBackendClientSecret: {{ .Values.Secrets.KeycloakBackendClientSecret | b64enc | quote }}
{{- end }}
